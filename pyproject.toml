[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat-layout 자동 탐색이 server.py/test_connection.py까지 건네며 빌드가 실패하므로
# 데이터 클라이언트 모듈만 명시한다 (upstream fjuliofontes/amazfit-mcp 코드 무변경).
py-modules = ["zepp_client", "decoder", "normalize", "training", "known_devices"]

[project]
name = "amazfit-mcp"
version = "0.1.0"
description = "MCP server exposing Zepp / Amazfit cloud data (workouts, sleep, readiness, PAI, stress, SpO2) to AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
